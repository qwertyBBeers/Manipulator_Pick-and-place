# Identical to skrl_ppo_cfg.yaml except `agent.experiment.experiment_name`
# below (gives this stage's TensorBoard runs a readable name --
# `train.py` prepends "<date>_<time>_ppo_torch_" automatically, this is
# just the suffix). Keep hyperparameters in sync with skrl_ppo_cfg.yaml by
# hand if either changes -- a Hydra CLI override
# (`++agent.experiment.experiment_name=...`) was tried first and rejected
# ("not in struct") by this IsaacLab version's hydra_task_config wrapping,
# hence this file instead of a one-line override.
seed: 42

models:
  separate: False
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1  # auto (== agent.rollouts)

agent:
  class: PPO
  rollouts: 24
  learning_epochs: 8
  # 16, not 4 -- num_envs is 8192 here (4x the 2048 the base skrl_ppo_cfg.yaml
  # was tuned at), so mini_batches scales 4x too to hold the per-gradient-step
  # batch size fixed at num_envs*rollouts/mini_batches = 12288, same as the
  # already-validated 2048-env runs. Scaling num_envs alone without this
  # would have silently ballooned the batch size, changing the optimization
  # itself, not just the data-collection parallelism.
  mini_batches: 16
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 1.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.001
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.01
  time_limit_bootstrap: False
  experiment:
    directory: "rb5_pick_place"
    experiment_name: "PPO(GraspLift)"
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  # Bumped from the initial 48000 (which, combined with the num_envs=512
  # smoke run, totaled ~24.6M env-transitions -- ~6x less than IsaacLab's
  # own Franka Lift recipe's ~147M at num_envs=4096/timesteps=36000, despite
  # our task also being strictly harder: it requires an actual release, not
  # just holding near a floating target). At num_envs=2048 this now totals
  # ~205M transitions, exceeding that reference.
  timesteps: 100000
  environment_info: log
